.flow{width:880px}

.branches{display:flex;gap:16px;margin-top:0}
.branch{flex:1}
.arrow{width:2px;background:#D8D0CA;height:28px;margin:0 auto}
.dest{background:#fff;border:1px solid #E3DCD6;border-radius:10px;padding:22px;text-align:center}
.dest .m{font-size:30px;font-weight:800}
.dest .q{font-size:20px;color:#6B625E;margin-top:8px}
.dest.hot{border:2px solid #B23A48}
.dest.hot .m{color:#B23A48}
.cap2{font-size:19px;color:#8A8078;text-align:center;margin-top:10px}
/* 3: 價格 */
.price{width:880px}
.bar{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.bar .lbl{width:190px;font-size:24px;font-weight:700}
.bar .track{flex:1;height:52px;background:#fff;border:1px solid #E3DCD6;border-radius:6px;position:relative;overflow:hidden}
.bar .fill{height:100%;background:#E8E1DC}
.bar.lock .fill{background:#B23A48}
.bar .amt{width:130px;text-align:right;font-size:24px;font-weight:800}
.bar .lockx{position:absolute;right:12px;top:12px;font-size:20px;color:#B23A48;font-weight:800}
/* 4: 對照 */
.ba{display:flex;gap:18px;width:880px}
.pane{flex:1;background:#fff;border:1px solid #E3DCD6;border-radius:10px;padding:26px}
.pane .h{font-size:19px;letter-spacing:.1em;color:#6B625E;font-weight:700}
.pane .v{font-size:33px;font-weight:800;margin-top:14px;line-height:1.35}
.pane .n{font-size:19px;color:#8A8078;margin-top:12px;line-height:1.5}
.pane.hot{border:2px solid #B23A48}.pane.hot .h{color:#B23A48}
.strike2{color:#B0A79F;text-decoration:line-through}

.chk{width:880px}
.itemx{display:flex;gap:20px;align-items:flex-start;padding:22px 0;border-top:1px solid #E3DCD6}
.num{width:52px;height:52px;flex:0 0 52px;border-radius:50%;background:#B23A48;color:#fff;font-size:25px;font-weight:800;display:flex;align-items:center;justify-content:center}
.itemx .t{font-size:31px;font-weight:700}
.itemx .d{font-size:21px;color:#6B625E;margin-top:6px}
.cta{margin-top:26px;background:#1F1B1A;color:#F7F5F2;border-radius:10px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;font-size:27px;font-weight:800}
.cta em{font-style:normal;color:#E8A0A9;font-size:22px;letter-spacing:.1em}
